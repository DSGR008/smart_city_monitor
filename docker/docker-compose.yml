services:
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: smartcity
    ports:
      - "5432:5432"
    volumes:
     - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql